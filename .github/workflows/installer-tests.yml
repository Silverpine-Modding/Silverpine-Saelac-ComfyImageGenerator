name: Server installer tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test downloads, upgrades, paths and model acknowledgement
        run: python -m unittest discover -s Tests/Installer -v
      - name: Check Unix launcher syntax
        if: runner.os != 'Windows'
        run: |
          sh -n AnimaCompatibility/Install-AnimaSupport.sh
          sh -n AnimaCompatibility/Install-AnimaSupport.command
